name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `next typegen` genera `next-env.d.ts` y los tipos de las rutas, que no
      # están en el repo (los crea `next dev`). Así `tsc` chequea en CI lo mismo
      # que en local, sin correr un build entero.
      - name: Typecheck
        run: bun run typecheck

      # Los tests usan una base SQLite temporal (`tests/setup.ts`): no hacen
      # falta secretos.
      - name: Tests
        run: bun run test
